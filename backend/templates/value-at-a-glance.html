:root{
 --navy:#001941;--navy2:#0a2650;--navy3:#12315f;--rail:#1b3a68;
 --yellow:#ffad00;--blue:#3aa0c9;--dark-blue:#003861;
 --red:#e5546a;--orange:#fb790f;--gold:#ffad00;--teal:#2aadab;--green:#5fd1a7;
 --mute:rgba(255,255,255,.55);--mute2:rgba(255,255,255,.32);
 --font-family:"Figtree",Arial,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-family);background:#0a1120;color:#fff;
 display:flex;flex-direction:column;align-items:center;padding:32px 16px;gap:16px}
.hint{font-size:13px;color:#b9c2d0;max-width:1040px;text-align:center;line-height:1.5}
.hint b{color:#fff}
.stage{width:100%;max-width:1280px}
.slide{position:relative;width:1280px;height:720px;transform-origin:top left;background:var(--navy);
 border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);
 padding:40px 46px 30px;display:flex;flex-direction:column}
.slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--yellow)}
.head{display:flex;justify-content:space-between;align-items:flex-start}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:2.6px;text-transform:uppercase;color:var(--yellow)}
.title{font-size:44px;font-weight:800;letter-spacing:-.9px;line-height:1;margin-top:6px;color:#fff}
.title u{text-decoration:none}
.ubar{width:150px;height:6px;border-radius:3px;background:var(--yellow);margin-top:14px}
.logo{position:absolute;top:26px;right:30px}
.logo svg{height:36px;width:auto;display:block}
/* KPI cards, grouped 2-2-2 */
.kpis{display:flex;gap:12px;margin-top:22px}
.kgroup{display:flex;gap:12px;flex:1}
.kgroup+.kgroup{margin-left:10px}
.kpi{flex:1;background:var(--navy2);border-radius:12px;padding:14px 16px 13px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;height:5px;width:100%;background:var(--c)}
.kpi .v{font-size:31px;font-weight:800;letter-spacing:-1px;line-height:1;color:#fff}
.kpi .l{margin-top:8px;font-size:12px;font-weight:600;color:var(--mute);line-height:1.2}
/* table */
.tblwrap{margin-top:18px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
col.pub{width:15%}
th,td{padding:0 12px}
/* super header */
tr.grp th{height:28px;font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
 text-align:center;border-bottom:2px solid var(--gc);color:var(--gc);vertical-align:bottom;padding-bottom:6px}
tr.grp th.blank{border:none}
/* sub header */
tr.sub th{height:28px;font-size:11.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
 color:var(--mute);vertical-align:bottom;padding-bottom:6px}
tr.sub th.pub{text-align:left;color:#fff}
tr.sub th.num{text-align:right}
/* body */
tbody td{height:33px;font-size:16px;color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
td.pub{text-align:left;font-weight:700}
td.num{text-align:right}
tbody tr:nth-child(even){background:var(--navy2)}
td.dash{color:var(--mute2);font-weight:700}
/* total */
tr.total td{height:42px;background:var(--navy3);color:#fff;font-weight:800;font-size:17px;
 border-top:2px solid var(--yellow)}
tr.total td:first-child{border-top-left-radius:8px;border-bottom-left-radius:8px}
tr.total td:last-child{border-top-right-radius:8px;border-bottom-right-radius:8px}
.foot{display:flex;justify-content:flex-end;margin-top:auto;padding-top:10px}
.conf{font-size:11px;color:var(--mute2);font-weight:500}
</style></head>

function money(v){if(v==null||v===0)return null;
 if(Math.abs(v)>=1e6)return "$"+(v/1e6).toFixed(1).replace(/\.0$/,"")+"M";
 if(Math.abs(v)>=1e3)return "$"+Math.round(v/1e3)+"K";return "$"+v;}
const FLAT=GROUPS.flatMap(g=>g.cols.map(c=>c.key));
function render(d){
 document.getElementById("eyebrow").innerHTML=d.period.replace("–","&ndash;");
 const k=document.getElementById("kpis");k.innerHTML="";
 // KPI cards derive from the column totals
 GROUPS.forEach(g=>{const wrap=document.createElement("div");wrap.className="kgroup";
  g.cols.forEach(col=>{const raw=d.total[col.key];let v=money(raw)||"\u2013";
   if(raw&&Math.abs(raw)>=1e6)v+="+";
   const el=document.createElement("div");el.className="kpi";el.style.setProperty("--c",col.kc);
   el.innerHTML='<div class="v">'+v+'</div><div class="l">'+col.kpi+'</div>';wrap.appendChild(el);});
  k.appendChild(wrap);});
 const t=document.getElementById("tbl");
 let cols='<colgroup><col class="pub">'+FLAT.map(()=>'<col>').join("")+'</colgroup>';
 let grp='<tr class="grp"><th class="blank"></th>';
 GROUPS.forEach(g=>{grp+='<th colspan="2" style="--gc:'+g.color+'">'+g.name+'</th>';});
 grp+='</tr>';
 let sub='<tr class="sub"><th class="pub">Publisher</th>';
 GROUPS.forEach(g=>g.cols.forEach(c=>sub+='<th class="num">'+c.sub+'</th>'));
 sub+='</tr>';
 let body='<tbody>';
 d.rows.forEach(r=>{body+='<tr><td class="pub">'+r.pub+'</td>'+
   FLAT.map(k=>{const m=money(r[k]);return m?'<td class="num">'+m+'</td>':'<td class="num dash">&ndash;</td>';}).join("")+'</tr>';});
 body+='</tbody>';
 const tt=d.total;
 let tot='<tbody><tr class="total"><td class="pub">'+tt.pub+'</td>'+
   FLAT.map(k=>{const m=money(tt[k]);return '<td class="num">'+(m||"&ndash;")+'</td>';}).join("")+'</tr></tbody>';
 t.innerHTML=cols+'<thead>'+grp+sub+'</thead>'+body+tot;
}
render(data);

 const sc=Math.min(1,st.clientWidth/1280);s.style.transform="scale("+sc+")";st.style.height=(720*sc)+"px";}
addEventListener("resize",fit);fit();
